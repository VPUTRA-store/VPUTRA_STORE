    function renderList(dataArray, elementId) {
      const container = document.getElementById(elementId);
      if(!container) return;
      container.innerHTML = '';
      dataArray.forEach(item => {
        const card = document.createElement('div');
        card.className = 'horizontal-card';
        card.onclick = function() { bukaPopup(item.nama); };
        card.innerHTML = `
          <div class="horizontal-img-box">
            <img src="${item.gambar}" alt="${item.nama}" onerror="this.src='https://via.placeholder.com/150?text=VPUTRA'">
          </div>
          <div class="horizontal-title">${item.nama}</div>
        `;
        container.appendChild(card);
      });
    }

    // Fungsi Pop-up Utama & Logika Cabang Menu / Akun
    function bukaPopup(namaProduk) {
      document.getElementById('popupTitleinnerText = "PILIH VARIAN:\n" + namaProduk;');
      document.getElementById('popupTitle').innerText = "PILIH VARIAN:\n" + namaProduk;
      const container = document.getElementById('submenuContainer');
      const detailContainer = document.getElementById('accountDetailContainer');
      container.innerHTML = '';
      detailContainer.innerHTML = '';
      detailContainer.style.display = 'none';
      container.style.display = 'flex';

      let listMenu = customSubMenuProduk[namaProduk] || daftarSubMenuDefault;

      listMenu.forEach(item => {
        const a = document.createElement('a');
        a.className = 'submenu-item';
        
        // Cek jika ini adalah tipe Akun (Jual/Beli Akun dengan Galeri & Tombol Minat)
        if(item.tipe === 'akun') {
          a.href = "javascript:void(0)";
          a.innerHTML = `<span>📂 ${item.nama}</span> ➔`;
          a.onclick = function() {
            tampilkanDetailAkun(item);
          };
        } 
        // Cek jika ini adalah tipe Menu Cabang (Joko / Item Game)
        else if(item.tipe === 'menu') {
          a.href = "javascript:void(0)";
          a.innerHTML = `<span>📂 ${item.nama}</span> ➔`;
          a.onclick = function() {
            tampilkanSubMenuCabang(item.nama, item.subItems);
          };
        } 
        // Menu standar langsung link Discord
        else {
          a.href = item.link || "#";
          a.target = '_blank';
          a.innerHTML = `<span>📂 ${item.nama}</span> ➔`;
        }
        
        container.appendChild(a);
      });

      document.getElementById('productModal').style.display = 'flex'; 
    }

    // Menampilkan Sub-Menu Cabang (Contoh: Fish It -> Ikan Secret Tumbal)
    function tampilkanSubMenuCabang(namaMenu, subItems) {
      document.getElementById('popupTitle').innerText = " PILIH ITEM / JOKI:\n" + namaMenu;
      const container = document.getElementById('submenuContainer');
      container.innerHTML = '';

      subItems.forEach(sub => {
        const a = document.createElement('a');
        a.className = 'submenu-item';
        a.href = sub.link;
        a.target = '_blank';
        a.innerHTML = `<span>🛒 ${sub.nama}</span> ➔`;
        container.appendChild(a);
      });
    }

    // Menampilkan Detail Akun, Galeri Foto (Max 10), dan Tombol Minat
    function tampilkanDetailAkun(akun) {
      document.getElementById('popupTitle').innerText = akun.nama;
      const container = document.getElementById('submenuContainer');
      const detailContainer = document.getElementById('accountDetailContainer');
      
      container.style.display = 'none';
      detailContainer.style.display = 'block';

      let galeriHTML = '<div class="account-gallery">';
      if(akun.gambarList && akun.gambarList.length > 0) {
        akun.gambarList.forEach(img => {
          galeriHTML += `<img src="${img}" onerror="this.src='https://via.placeholder.com/150?text=Preview'">`;
        });
      } else {
        galeriHTML += `<img src="https://via.placeholder.com/150?text=No+Image">`;
      }
      galeriHTML += '</div>';

      detailContainer.innerHTML = `
        ${galeriHTML}
        <a href="${akun.link}" target="_blank" class="btn-minat">🔥 MINAT? (CHAT DISCORD)</a>
        <button class="btn-popup-cancel" onclick="bukaPopup('${document.getElementById('popupTitle').innerText.split('\n')[1] || 'JUAL AKUN FF'}')">Kembali</button>
      `;
    }
    
    function tutupPopupProduk() { 
      document.getElementById('productModal').style.display = 'none'; 
    }

    // Render Semua Bagian Sesuai Data
    renderList(dataTrending, 'containerTrending');
    renderList(dataCloudPhone, 'containerCloudPhone');
    renderList(dataBagian1, 'containerBagian1');
    renderList(dataBagian2, 'containerBagian2');
    renderList(dataBagian3, 'containerBagian3');
    renderList(dataBagian4, 'containerBagian4');
    renderList(dataBagian5, 'containerBagian5');
    renderList(dataBagian6, 'containerBagian6');
    
    function filterProduk() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.horizontal-card');
        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            if (text.includes(input)) {
                card.style.display = "flex"; 
            } else {
                card.style.display = "none"; 
            }
        });
    }

    function tutupIklan() {
        const modalIklan = document.getElementById('popupIklan');
        if (modalIklan) {
            modalIklan.style.display = 'none';
        }
        sessionStorage.setItem('iklanSudahDitutup', 'true');
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem('iklanSudahDitutup') === 'true') {
            const modalIklan = document.getElementById('popupIklan');
            if (modalIklan) {
                modalIklan.style.display = 'none';
            }
        }
    });
  </script>
