    function bukaPopup(namaProduk) {
      document.getElementById('popupTitle').innerText = "PILIH VARIAN:\n" + namaProduk;
      const container = document.getElementById('submenuContainer');
      container.innerHTML = '';

      let listMenu = customSubMenuProduk[namaProduk] || daftarSubMenuDefault;

      listMenu.forEach(item => {
        const a = document.createElement('a');
        a.className = 'submenu-item';
        a.href = item.link;
        a.target = '_blank';
        a.innerHTML = `<span>📂 ${item.nama}</span> ➔`;
        container.appendChild(a);
      });

      document.getElementById('productModal').style.display = 'flex'; 
    }
    
    function tutupPopupProduk() { 
      document.getElementById('productModal').style.display = 'none'; 
    }

    function renderGrid(dataArray, elementId) {
      const grid = document.getElementById(elementId);
      if(!grid) return;
      grid.innerHTML = '';
      dataArray.forEach(item => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = function() { bukaPopup(item.nama); };
        card.innerHTML = `
          <div class="image-wrapper"><img src="${item.gambar}" alt="${item.nama}" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'"></div>
          <div class="card-title-box">${item.nama}</div>
        `;
        grid.appendChild(card);
      });
    }

    renderGrid(dataBagian1, 'gridBagian1');
    renderGrid(dataBagian2, 'gridBagian2');
    renderGrid(dataBagian3, 'gridBagian3');
    renderGrid(dataBagian4, 'gridBagian4');
    renderGrid(dataBagian5, 'gridBagian5');
    renderGrid(dataBagian6, 'gridBagian6');
    renderGrid(dataBagian7, 'gridBagian7');
    
    function filterProduk() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.game-card');
        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            if (text.includes(input)) {
                card.style.display = ""; 
            } else {
                card.style.display = "none"; 
            }
        });
    }

    // Fungsi Khusus Tutup Iklan & Sesi Storage (Dipisah agar tidak bentrok)
    function tutupIklan() {
        const modalIklan = document.getElementById('popupIklan');
        if (modalIklan) {
            modalIklan.style.display = 'none';
        }
        sessionStorage.setItem('iklanSudahDitutup', 'true');
    }

    // Saat halaman dimuat, cek apakah iklan sudah pernah ditutup sebelumnya
    document.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem('iklanSudahDitutup') === 'true') {
            const modalIklan = document.getElementById('popupIklan');
            if (modalIklan) {
                modalIklan.style.display = 'none';
            }
        }
    });
  </script>
